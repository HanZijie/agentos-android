# 可以在电脑上跑的测试（docs/implementation-plan.md 第 2 节 CI）：
# - Gradle：core/runtime、core/extensions 等模块的单元测试与 Android Lint
# - core/pi-runtime：Pi Agent core 的打包与契约测试（W3 起）
# - tests/acp-conformance：官方 TypeScript ACP 客户端的一致性测试：经 stdio（W4 起），经电脑上的网关 + tools/acp-bridge，
#   以及网关的配对与安全用例（W9 起）。手机上的用例（AGENTOS_ACP_DEVICE）需要设备，CI 里自动跳过
# 后两项在对应工程出现之前自动跳过。
name: portable-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  # 与 ../pi-acp-adapter 的 engines 一致（>=22.19.0）
  NODE_VERSION: "22"

jobs:
  gradle:
    name: Gradle 单元测试与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试与 Lint
        # 单元测试不需要 pi-agent.js，跳过 Pi 打包；打包由下面的 pi-runtime 任务和 module-package.yml 负责
        run: ./gradlew --stacktrace test lint -Pagentos.skipPiBundle=true

      - name: 上传测试与 Lint 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  pi-runtime:
    name: Pi Agent core 打包与契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core/pi-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('core/pi-runtime/package-lock.json') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core/pi-runtime/package-lock.json

      - name: 安装依赖
        if: hashFiles('core/pi-runtime/package-lock.json') != ''
        run: npm ci

      - name: 打包 pi-agent.js 与 model-catalog.json
        if: hashFiles('core/pi-runtime/build.mjs') != ''
        run: node build.mjs

      - name: 契约测试
        if: hashFiles('core/pi-runtime/package-lock.json') != ''
        run: npm run --if-present test

  acp-conformance:
    name: ACP 一致性测试（stdio、电脑端网关 + acp-bridge；FakeAgentCore 与真实 Pi）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle 配置全部项目时 AGP 需要 Android SDK
      - uses: android-actions/setup-android@v3
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''

      - uses: gradle/actions/setup-gradle@v4
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''

      - uses: actions/setup-node@v4
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tests/acp-conformance/package-lock.json
            core/pi-runtime/package-lock.json

      - name: 安装依赖
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''
        working-directory: tests/acp-conformance
        run: npm ci

      - name: 构建电脑端 Agent 进程的类路径
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''
        run: ./gradlew --stacktrace :core:runtime:acpConformanceClasspath -Pagentos.skipPiBundle=true

      - name: 桥接命令（tools/acp-bridge，无依赖）
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''
        run: node tools/acp-bridge/acp-bridge.mjs --version

      - name: 一致性测试（FakeAgentCore）
        if: hashFiles('tests/acp-conformance/package-lock.json') != ''
        working-directory: tests/acp-conformance
        run: npm test

      # W4 收尾（A5）：同一组用例换成真实的 Pi Agent core（PiAdapter + 电脑上的 QuickJS）+ 假模型端点，两个协议族各跑一遍
      - name: 打包 Pi Agent core（pi-agent.js、model-catalog.json）
        if: hashFiles('tests/acp-conformance/package-lock.json') != '' && hashFiles('core/pi-runtime/build.mjs') != ''
        working-directory: core/pi-runtime
        run: npm ci && node build.mjs

      - name: 一致性测试（真实 Pi + 假模型端点）
        if: hashFiles('tests/acp-conformance/package-lock.json') != '' && hashFiles('core/pi-runtime/build.mjs') != ''
        working-directory: tests/acp-conformance
        run: |
          AGENTOS_ACP_CORE=pi AGENTOS_ACP_PI_API=anthropic npm test
          AGENTOS_ACP_CORE=pi AGENTOS_ACP_PI_API=openai npm test

  device-test-scripts:
    name: 设备测试脚本的单元测试（假模型端点、验收驱动；不需要设备）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单元测试（tests/device/acp-channel/unit）
        working-directory: tests/device/acp-channel
        run: python3 -m unittest discover -s unit -p 'test_*.py' -v
