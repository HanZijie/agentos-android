# 可以在电脑上跑的测试（docs/implementation-plan.md 第 2 节 CI）：
# - Gradle：core/runtime、core/extensions 等模块的单元测试与 Android Lint
# - core/pi-runtime：Pi Agent core 的打包与契约测试；打包产物（pi-agent.js、model-catalog.json）上传一次，ACP 一致性测试直接用
# - tests/acp-conformance：官方 TypeScript ACP 客户端的一致性测试：经 stdio，经电脑上的网关 + tools/acp-bridge，
#   以及网关的配对与安全用例。手机上的用例（AGENTOS_ACP_DEVICE）需要设备，CI 里自动跳过
# - Python 脚本：tools/check-i18n.py（中英文资源对齐与字面量门禁，docs/next-apps-plan.md 7.2 R9）、tools/tests、
#   tests/device/acp-channel/unit（假模型端点、验收驱动；不需要设备），都是秒级
#
# 这里没有“文件存在才执行”的守卫：缺文件（改名、误删）必须让任务变红，而不是静默变成什么都没跑的绿。
name: portable-tests

on:
  push:
    # 只在 main 上跑 push；功能分支靠 pull_request，避免同一个提交跑两遍
    branches: [main]
    # 只有“全部改动的文件都匹配”时才跳过。README 和文档里的图片/视频不影响任何测试；
    # docs/*.md 不在其中：有测试把它们当契约读（docs/sample-apps.md；contracts/*.md 也不在忽略范围内）
    paths-ignore:
      - "README*.md"
      - "docs/assets/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "docs/assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  # 与 ../pi-acp-adapter 的 engines 一致（>=22.19.0）
  NODE_VERSION: "22"

jobs:
  scripts:
    name: Python 脚本检查（i18n 门禁、tools 单测、设备脚本单测；不需要 Android SDK）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 三步互相独立：前一步红了后面的也照跑，一次看全
      - name: tools 脚本自己的单元测试
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: check-i18n
        if: ${{ !cancelled() }}
        run: python3 tools/check-i18n.py

      - name: 设备测试脚本的单元测试（tests/device/acp-channel/unit）
        if: ${{ !cancelled() }}
        working-directory: tests/device/acp-channel
        run: python3 -m unittest discover -s unit -p 'test_*.py' -v

  gradle:
    name: Gradle 单元测试与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          # action 默认是 "tools platform-tools"；旧的 tools 包已从 SDK 仓库下线，sdkmanager 会以 exit 1 失败
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: 单元测试与 Lint
        # 单元测试不需要 pi-agent.js，跳过 Pi 打包；打包由下面的 pi-runtime 任务和 module-package.yml 负责
        run: ./gradlew --stacktrace test lint -Pagentos.skipPiBundle=true

      - name: 上传测试与 Lint 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  pi-runtime:
    name: Pi Agent core 打包与契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core/pi-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: core/pi-runtime/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 打包 pi-agent.js 与 model-catalog.json
        run: node build.mjs

      - name: 契约测试
        run: npm test

      # 只在这里打包一次；ACP 一致性测试（真实 Pi）直接用这份，不再自己 npm ci + build
      - name: 上传 Pi 产物
        uses: actions/upload-artifact@v4
        with:
          name: pi-assets
          path: |
            app/src/main/assets/pi-agent.js
            app/src/main/assets/model-catalog.json
          if-no-files-found: error
          retention-days: 1

  acp-conformance:
    name: ACP 一致性测试（stdio、电脑端网关 + acp-bridge；FakeAgentCore 与真实 Pi）
    needs: pi-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Gradle 配置全部项目时 AGP 需要 Android SDK
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/acp-conformance/package-lock.json

      - name: 安装依赖
        working-directory: tests/acp-conformance
        run: npm ci

      - name: 取 pi-runtime 任务打好的 Pi 产物（pi-agent.js、model-catalog.json）
        uses: actions/download-artifact@v4
        with:
          name: pi-assets
          path: app/src/main/assets

      - name: 构建电脑端 Agent 进程的类路径
        run: ./gradlew --stacktrace :core:runtime:acpConformanceClasspath -Pagentos.skipPiBundle=true

      - name: 桥接命令（tools/acp-bridge，无依赖）
        run: node tools/acp-bridge/acp-bridge.mjs --version

      - name: 一致性测试（FakeAgentCore）
        working-directory: tests/acp-conformance
        run: npm test

      # 同一组用例换成真实的 Pi Agent core（PiAdapter + 电脑上的 QuickJS）+ 假模型端点，两个协议族各跑一遍
      - name: 一致性测试（真实 Pi + 假模型端点）
        working-directory: tests/acp-conformance
        run: |
          AGENTOS_ACP_CORE=pi AGENTOS_ACP_PI_API=anthropic npm test
          AGENTOS_ACP_CORE=pi AGENTOS_ACP_PI_API=openai npm test
