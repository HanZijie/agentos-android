<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1310" viewBox="0 0 1400 1310" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .lt { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bt { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .bs { font-size: 12px; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
      .lbl { font-size: 12px; fill: #334155; }
      .ar { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .bind2 { stroke: #7c3aed; stroke-width: 2; fill: none; marker-start: url(#arrB); marker-end: url(#arrB); }
      .aidl2 { stroke: #0d9488; stroke-width: 2; fill: none; marker-start: url(#arrT); marker-end: url(#arrT); }
      .adb2 { stroke: #2563eb; stroke-width: 2; fill: none; marker-start: url(#arrA); marker-end: url(#arrA); }
      .sup { stroke: #c2410c; stroke-width: 1.8; stroke-dasharray: 7 4; fill: none; marker-end: url(#arrR); }
      .lB { font-size: 12px; fill: #6d28d9; }
      .lT { font-size: 12px; fill: #0f766e; }
      .lA { font-size: 12px; fill: #1d4ed8; }
      .lR { font-size: 12px; fill: #9a3412; }
    </style>
  </defs>

  <rect width="1400" height="1310" fill="#fafafa"/>

  <text x="50" y="44" font-size="24" font-weight="700" fill="#0f172a">AgentOS：已 root 的手机 + 一个 zip 即可使用</text>
  <text x="50" y="68" font-size="13" fill="#64748b">在 Magisk / KernelSU 里刷入 agentos.zip，重启后自动装好 App，并由 root 监督进程拉起运行时；不需要刷 ROM。对外只有一种协议：ACP；插件用标准 Agent Plugins 1.0</text>

  <!-- ① ACP clients -->
  <rect x="50" y="88" width="1300" height="112" rx="10" fill="#EEF4FF" stroke="#c7d7fe"/>
  <text x="66" y="110" class="lt">① ACP 客户端</text>
  <rect x="66" y="122" width="416" height="64" rx="8" class="box"/>
  <text x="80" y="147" class="bt">AgentOS App 自带界面</text>
  <text x="80" y="170" class="bs">助理浮层（长按电源）· 对话 · 快捷开关 · 悬浮球（运行在主进程）</text>
  <rect x="492" y="122" width="416" height="64" rx="8" class="box"/>
  <text x="506" y="147" class="bt">后装的第三方 App</text>
  <text x="506" y="170" class="bs">引入 acp-android SDK，用标准 ACP 客户端接口调用</text>
  <rect x="918" y="122" width="416" height="64" rx="8" class="box"/>
  <text x="932" y="147" class="bt">电脑上的 ACP 客户端</text>
  <text x="932" y="170" class="bs">编辑器 / 命令行，经 USB 调试连接手机</text>

  <!-- ② AgentOS App -->
  <rect x="50" y="256" width="1084" height="498" rx="10" fill="#F3EEFF" stroke="#ddd0fe"/>
  <text x="66" y="278" class="lt">② AgentOS App（普通 App · 随 zip 自动安装 · 用项目证书签名 · 三个进程）</text>

  <!-- :agent runtime -->
  <rect x="66" y="292" width="1052" height="230" rx="10" fill="#F0FDF4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="82" y="318" font-size="16" font-weight="700" fill="#14532d">:agent 运行时<tspan font-size="13" font-weight="400" fill="#166534">（Kotlin 宿主层 + Pi Agent core · 有任务时以前台服务运行）</tspan></text>

  <rect x="82" y="330" width="800" height="58" rx="8" class="box"/>
  <text x="96" y="353" class="bt">ACP 入口</text>
  <text x="96" y="375" class="bs">对外 Binder 服务 · 首次调用授权 · 按调用方 UID 隔离会话 · 按 App 限额</text>
  <rect x="898" y="330" width="204" height="58" rx="8" class="box"/>
  <text x="912" y="353" class="bt">电脑端网关</text>
  <text x="912" y="375" class="bs">抽象 socket · 配对码</text>

  <rect x="82" y="398" width="1020" height="36" rx="8" fill="#DBEAFE" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="96" y="421" font-size="13" fill="#1e3a8a"><tspan font-weight="700">ACP Agent　</tspan>官方 Kotlin SDK 的 Agent 端，实现 AgentOS Profile　→　<tspan font-weight="700">Pi 适配层　</tspan>会话 ↔ Pi Agent · 事件映射 · 工具与确认桥接</text>

  <rect x="82" y="444" width="1020" height="64" rx="8" fill="#CCFBF1" stroke="#14b8a6" stroke-width="1.2"/>
  <text x="96" y="469" font-size="12.5" fill="#134e4a"><tspan font-weight="700">Pi Agent core　</tspan>上游 @earendil-works/pi-agent-core，跑在内嵌的 QuickJS 里：模型调用 · Agent 循环 · 工具调用校验与调度 · 上下文</text>
  <text x="96" y="493" font-size="12.5" fill="#134e4a"><tspan font-weight="700">宿主层　</tspan>Session / Event Store · 调度与恢复 · Session Router（Jev）· Capability Broker · Risk Policy · Hook 触发点 · Skill 目录 · 密钥 · 网络出口</text>

  <!-- ① -> :agent (drawn after ② so the regions do not cover the lines) -->
  <path d="M274,186 V216 H700 V330" class="bind2"/>
  <path d="M700,186 V330" class="bind2"/>
  <text x="690" y="242" text-anchor="end" class="lB">Android Binder · IAcpService · binder-channel（承载 ACP）</text>
  <path d="M1000,186 V330" class="adb2"/>
  <text x="1010" y="242" class="lA">adb forward → 抽象 socket agentos-acp · 配对码</text>

  <!-- main process -->
  <rect x="66" y="570" width="516" height="168" rx="8" class="box"/>
  <text x="80" y="594" class="bt">主进程（界面）</text>
  <rect x="80" y="606" width="239" height="118" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="94" y="630" class="bt">确认界面</text>
  <text x="94" y="652" class="bs">写操作、高风险工具逐次确认</text>
  <text x="94" y="672" class="bs">调用方 App 和 Hook 都不能替用户同意</text>
  <text x="94" y="692" class="bs">不在前台时走通知</text>
  <rect x="329" y="606" width="239" height="118" rx="8" fill="#F8FAFC" stroke="#cbd5e1"/>
  <text x="343" y="630" class="bt">设置与状态</text>
  <text x="343" y="652" class="bs">自带模型 key（BYOK）</text>
  <text x="343" y="672" class="bs">已授权的 App 与各自用量</text>
  <text x="343" y="692" class="bs">插件 · 第三方 MCP · Hook 审核</text>
  <text x="343" y="712" class="bs">安全等级 · 监督状态 · 诊断</text>

  <!-- :ext -->
  <rect x="598" y="570" width="520" height="168" rx="8" fill="#EDE9FE" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="612" y="594" class="bt">:ext 进程（Extension Host）</text>
  <text x="612" y="620" class="bs">Agent Plugins 1.0 解析与校验</text>
  <text x="612" y="644" class="bs">MCP 客户端：Binder · Streamable HTTP</text>
  <text x="612" y="668" class="bs">Skills 目录 · Hooks 调度</text>
  <text x="612" y="692" class="bs">信任审核 · 按工具的审批策略</text>

  <!-- internal AIDL -->
  <path d="M300,522 V570" class="aidl2"/>
  <text x="312" y="550" class="lT">IAgentControl（设置、确认、诊断）</text>
  <path d="M860,522 V570" class="aidl2"/>
  <text x="872" y="550" class="lT">IExtensionHost（工具、Skills、Hooks）</text>

  <!-- ③ Cloud models -->
  <rect x="1180" y="396" width="170" height="120" rx="10" fill="#F0F9FF" stroke="#bae6fd"/>
  <text x="1194" y="418" class="lt">③ 云端模型</text>
  <rect x="1192" y="432" width="146" height="68" rx="8" class="box"/>
  <text x="1204" y="458" font-size="13" font-weight="700" fill="#0f172a">MiniMax-M3 · Jev</text>
  <text x="1204" y="482" class="bs">任意 BYOK 端点</text>
  <line x1="1118" y1="466" x2="1190" y2="466" class="ar"/>
  <text x="1157" y="458" text-anchor="middle" font-size="11" fill="#334155">HTTPS</text>

  <!-- ④ Extensions -->
  <rect x="50" y="816" width="1300" height="208" rx="10" fill="#FFF6E5" stroke="#fde3b0"/>
  <text x="66" y="838" class="lt">④ 扩展（Agent Plugins 1.0：Skills · MCP · Hooks）</text>
  <text x="1334" y="1011" text-anchor="end" font-size="11.5" fill="#92400e">* 高风险：默认关闭，每次确认　规划中（M6）：AppFunctions 桥、无障碍 / GUI 兜底</text>
  <rect x="66" y="852" width="309" height="138" rx="8" class="box"/>
  <text x="80" y="875" class="bt">本地 App 内嵌插件</text>
  <text x="80" y="897" class="bs">插件包放在 assets/agent-plugin/</text>
  <text x="80" y="917" class="bs">MCP 服务在 App 自己的进程里运行</text>
  <text x="80" y="937" class="bs">Binder · binder-channel</text>
  <text x="80" y="957" class="bs">要求 BIND_MCP_SERVICE</text>
  <text x="80" y="977" class="bs">端点声明在 extensions."org.agentos"</text>
  <rect x="385" y="852" width="309" height="138" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="399" y="875" class="bt">AgentOS 自带插件（装上即可用）</text>
  <text x="399" y="897" class="bs">Intent / 分享 · 通知 · 日历 / 联系人</text>
  <text x="399" y="917" class="bs">同样以 Binder 提供 MCP 服务</text>
  <text x="399" y="937" class="bs">shell *：命令交给 Runner 执行</text>
  <rect x="704" y="852" width="309" height="138" rx="8" class="box"/>
  <text x="718" y="875" class="bt">导入的插件包 · 第三方 MCP</text>
  <text x="718" y="897" class="bs">标准插件包（zip）：Skills · MCP · Hooks</text>
  <text x="718" y="917" class="bs">远端 MCP 只走 HTTPS · Streamable HTTP</text>
  <text x="718" y="937" class="bs">stdio、sse 标为不支持</text>
  <rect x="1023" y="852" width="311" height="138" rx="8" fill="#F5F3FF" stroke="#7c3aed"/>
  <text x="1037" y="875" class="bt">Runner（独立 UID）</text>
  <text x="1037" y="897" class="bs">用 /system/bin/sh 执行命令</text>
  <text x="1037" y="917" class="bs">Hooks · shell 工具 · Skill 脚本</text>
  <text x="1037" y="937" class="bs">不申请任何权限</text>
  <text x="1037" y="957" class="bs">拿不到 AgentOS 的数据和内部接口</text>

  <!-- :ext -> ④ (drawn after ④ so the region does not cover the lines) -->
  <path d="M640,738 V852" class="bind2"/>
  <path d="M640,738 V780 H36 V921 H65" class="bind2"/>
  <text x="232" y="802" class="lB">Binder · IMcpService · binder-channel（MCP）</text>
  <line x1="858" y1="738" x2="858" y2="850" class="ar"/>
  <text x="868" y="790" class="lbl">HTTPS · Streamable HTTP</text>
  <path d="M1080,738 V852" class="bind2"/>
  <text x="1090" y="790" class="lB">Binder（执行命令）</text>

  <!-- ⑤ Module -->
  <rect x="50" y="1046" width="1300" height="150" rx="10" fill="#F4F4F5" stroke="#d4d4d8"/>
  <text x="66" y="1068" class="lt">⑤ agentos.zip（Magisk / KernelSU 模块 · 只有脚本和两个 APK · root 不运行 AgentOS 的代码）</text>
  <rect x="66" y="1082" width="309" height="100" rx="8" class="box"/>
  <text x="80" y="1105" class="bt">安装前检查</text>
  <text x="80" y="1127" class="bs">API 35–37 · root 管理器版本</text>
  <text x="80" y="1147" class="bs">不满足直接拒装；未验证机型会提示</text>
  <rect x="385" y="1082" width="309" height="100" rx="8" class="box"/>
  <text x="399" y="1105" class="bt">App 自动安装与升级</text>
  <text x="399" y="1127" class="bs">zip 内置 AgentOS App 和 Runner 两个 APK</text>
  <text x="399" y="1147" class="bs">签名不符就停止并报告</text>
  <rect x="704" y="1082" width="309" height="100" rx="8" class="box"/>
  <text x="718" y="1105" class="bt">不改系统</text>
  <text x="718" y="1127" class="bs">不往 /system 挂载任何文件</text>
  <text x="718" y="1147" class="bs">不加 SELinux 规则</text>
  <text x="718" y="1167" class="bs">在 root 管理器里显示运行状态</text>
  <rect x="1023" y="1082" width="311" height="100" rx="8" fill="#FFF7ED" stroke="#c2410c" stroke-dasharray="6 3"/>
  <text x="1037" y="1105" class="bt">root 监督进程</text>
  <text x="1037" y="1127" class="bs">开机拉起 :agent · 判活 · 有任务时退避拉起</text>
  <text x="1037" y="1147" class="bs">崩溃循环或版本超出支持范围 → safe mode</text>
  <text x="1037" y="1167" class="bs">用显式广播向 App 报告状态</text>

  <!-- root supervisor -> :agent -->
  <path d="M1334,1132 H1372 V352 H1120" class="sup"/>
  <text x="1146" y="322" class="lR">am start-foreground-service</text>
  <text x="1146" y="340" class="lR">读心跳 · 状态广播</text>

  <!-- Footer -->
  <text x="50" y="1224" font-size="12.5" font-weight="700" fill="#047857">安全等级 best_effort：设备已 root，其他 root 应用可以读取 AgentOS App 的数据，这一点在设置页明确告知用户</text>
  <line x1="50" y1="1254" x2="90" y2="1254" class="bind2"/>
  <text x="98" y="1258" class="lB">Android Binder（导出服务，bindService 建立连接）</text>
  <line x1="398" y1="1254" x2="438" y2="1254" class="aidl2"/>
  <text x="446" y="1258" class="lT">App 内部 AIDL（不导出，只接受本 App 的 UID）</text>
  <line x1="729" y1="1254" x2="761" y2="1254" class="ar"/>
  <text x="769" y="1258" class="lbl">HTTPS</text>
  <line x1="832" y1="1254" x2="872" y2="1254" class="adb2"/>
  <text x="880" y="1258" class="lA">adb forward（USB 调试）</text>
  <line x1="1040" y1="1254" x2="1072" y2="1254" class="sup"/>
  <text x="1080" y="1258" class="lR">root 监督（只做进程管理）</text>
  <rect x="1244" y="1246" width="28" height="16" rx="3" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1280" y="1258" class="lbl">用户确认</text>
  <text x="50" y="1286" font-size="12" fill="#64748b">用户步骤：在 root 管理器里刷入 agentos.zip → 重启 → 打开 AgentOS App 完成首次引导</text>
</svg>
