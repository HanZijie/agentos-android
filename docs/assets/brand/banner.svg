<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">AgentOS for Android</title>
  <desc id="d">An agent runtime in the middle of an app ecosystem, next to the AgentOS for Android wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1d"/><stop offset="0.55" stop-color="#101638"/><stop offset="1" stop-color="#1c1245"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.52" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="0.5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.40"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3ddc84" stop-opacity="0.28"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.16"/></pattern>
    <clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <circle cx="170" cy="60" r="300" fill="url(#glowA)"/>
    <circle cx="1090" cy="300" r="340" fill="url(#glowB)"/>
    <circle cx="1000" cy="180" r="170" fill="url(#glowC)"/>

    <!-- logo -->
    <g transform="translate(84 92) scale(0.72)">
<rect width="256" height="256" rx="58" fill="url(#tile)"/>
<circle cx="128" cy="128" r="86" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3.5"/>
<polygon points="206.5,91.9 206.0,77.4 194.2,84.2" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
<polygon points="120.0,214.0 132.8,220.8 132.8,207.2" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
<polygon points="57.5,78.1 45.2,85.8 57.0,92.6" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
<line x1="128.0" y1="42.0" x2="128.0" y2="80.0" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
<line x1="202.5" y1="171.0" x2="169.6" y2="152.0" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
<line x1="53.5" y1="171.0" x2="86.4" y2="152.0" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
<rect x="104.0" y="18.0" width="48" height="48" rx="13.9" fill="#fff"/>
<g transform="translate(128.0 42.0) scale(1.000)"><g fill="none" stroke="#0d9488" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-9" width="24" height="22" rx="5"/><path d="M-12 -2H12M-6 -14v7M6 -14v7"/></g><rect x="-7" y="4" width="6" height="6" rx="1.6" fill="#0d9488"/></g>
<rect x="178.5" y="147.0" width="48" height="48" rx="13.9" fill="#fff"/>
<g transform="translate(202.5 171.0) scale(1.000)"><g fill="none" stroke="#d97706" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="1" r="10.5"/><path d="M0 -4.5v5.5l4.2 2.8M-11 -10l-3 -3M11 -10l3 -3"/></g></g>
<rect x="29.5" y="147.0" width="48" height="48" rx="13.9" fill="#fff"/>
<g transform="translate(53.5 171.0) scale(1.000)"><g fill="none" stroke="#7c3aed" stroke-width="3.6" stroke-linecap="round"><path d="M-11 -9h22M-11 0h22M-11 9h13"/></g></g>
<g stroke-linecap="round" stroke-linejoin="round">
    <path d="M112.0 114.3L101.2 96.5M144.0 114.3L154.8 96.5" stroke="#fff" stroke-width="7" fill="none"/>
    <path d="M91.0 147A37 37 0 0 1 165.0 147Z" fill="#fff" stroke="#fff" stroke-width="6"/>
    <circle cx="111.2" cy="136.8" r="6.0" fill="url(#core)"/><circle cx="144.8" cy="136.8" r="6.0" fill="url(#core)"/></g>
</g>

    <!-- wordmark -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="304" y="186" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff">Agent<tspan fill="url(#word)">OS</tspan></text>
      <text x="308" y="236" font-size="34" font-weight="500" letter-spacing="0.5" fill="#94a3b8">for Android</text>
    </g>

    <!-- protocol chips -->
    <g font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="600" text-anchor="middle">
      <g transform="translate(308 266)"><rect width="84" height="36" rx="18" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.55"/><text x="42" y="24.5" fill="#5eead4">ACP</text></g>
      <g transform="translate(404 266)"><rect width="84" height="36" rx="18" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.55"/><text x="42" y="24.5" fill="#93c5fd">MCP</text></g>
      <g transform="translate(500 266)"><rect width="104" height="36" rx="18" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55"/><text x="52" y="24.5" fill="#c4b5fd">Binder</text></g>
    </g>

    <!-- ecosystem motif: apps around one shared agent runtime -->
    <g transform="translate(1000 180)">
      <circle r="112" fill="none" stroke="#94a3b8" stroke-opacity="0.14" stroke-dasharray="3 7"/>
      <circle r="164" fill="none" stroke="#94a3b8" stroke-opacity="0.08"/>
      <line x1="0" y1="0" x2="-64.5" y2="-57.0" stroke="url(#link)" stroke-width="2.4" stroke-linecap="round"/><line x1="0" y1="0" x2="69.4" y2="-43.4" stroke="url(#link)" stroke-width="2.4" stroke-linecap="round"/><line x1="0" y1="0" x2="-69.4" y2="52.1" stroke="url(#link)" stroke-width="2.4" stroke-linecap="round"/><line x1="0" y1="0" x2="62" y2="75" stroke="url(#link)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 7"/><circle cx="-33.3" cy="-29.4" r="4.5" fill="#5eead4"/><circle cx="38.1" cy="-23.8" r="4.5" fill="#c4b5fd"/><circle cx="-35.8" cy="26.9" r="4.5" fill="#fbbf24"/><rect x="-136.0" y="-124.0" width="64" height="64" rx="18.6" fill="#0f172a" stroke="#5eead4" stroke-width="3"/><g transform="translate(-104 -92) scale(1.3333333333333333)"><g fill="none" stroke="#5eead4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-12" y="-9" width="24" height="22" rx="5"/><path d="M-12 -2H12M-6 -14v7M6 -14v7"/></g><rect x="-7" y="4" width="6" height="6" rx="1.6" fill="#5eead4"/></g><rect x="80.0" y="-102.0" width="64" height="64" rx="18.6" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/><g transform="translate(112 -70) scale(1.3333333333333333)"><g fill="none" stroke="#fbbf24" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="1" r="10.5"/><path d="M0 -4.5v5.5l4.2 2.8M-11 -10l-3 -3M11 -10l3 -3"/></g></g><rect x="-144.0" y="52.0" width="64" height="64" rx="18.6" fill="#0f172a" stroke="#c4b5fd" stroke-width="3"/><g transform="translate(-112 84) scale(1.3333333333333333)"><g fill="none" stroke="#c4b5fd" stroke-width="3.6" stroke-linecap="round"><path d="M-11 -9h22M-11 0h22M-11 9h13"/></g></g><rect x="58" y="44" width="64" height="64" rx="18.5" fill="none" stroke="#94a3b8" stroke-opacity=".7" stroke-width="2.6" stroke-dasharray="5 6"/><path d="M90 64v24M78 76h24" stroke="#94a3b8" stroke-opacity=".85" stroke-width="3.6" stroke-linecap="round"/>
      <circle r="64" fill="#8b5cf6" fill-opacity="0.18"/>
      <circle r="46" fill="url(#tile)"/>
      <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10.8 -9.7L-18.1 -22.1M10.8 -9.7L18.1 -22.1" stroke="#ffffff" stroke-width="5" fill="none"/>
    <path d="M-24.0 11A24 24 0 0 1 24.0 11Z" fill="#ffffff" stroke="#ffffff" stroke-width="6"/>
    <circle cx="-11.3" cy="5.1" r="4.0" fill="url(#core)"/><circle cx="11.3" cy="5.1" r="4.0" fill="url(#core)"/></g>
    </g>
  </g>
</svg>
