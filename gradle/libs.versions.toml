# 所有依赖版本集中锁定在这里，依据 docs/implementation-plan.md 第 2 节“依赖与版本锁定”。
# 升级任何一项都要单独评估：写进报告，由整合人决定；涉及 Kotlin / AGP / ACP SDK 的升级要重跑 S3 第一部分。
#
# 待定，出结论后再追加：
#   - quickjs-kt（io.github.dokar3:quickjs-kt）：S8 固定
#   - MCP Kotlin SDK（io.modelcontextprotocol:kotlin-sdk-client / kotlin-sdk-server）、Ktor 及其 OkHttp 引擎：S5 固定
#   - SQLite 驱动：W2 已选定 androidx.sqlite（见下方 androidx-sqlite）

[versions]
# Android 工具链。Kotlin 由 2.2.20 升到 2.3.20（整合人决定，2026-09-29）：
# quickjs-kt 1.0.15 用 Kotlin 2.4.10 构建，2.2 编译器读不了它的元数据；1.0.5 遇到中文 + emoji 会挂住（docs/spikes/S8.md d）。
# 2.3.20 + AGP 8.10.1 已由 S8（JVM、Android debug / R8 release）和整合时重跑的 S3 场景验证。
# 最终版本随 S5（MCP Kotlin SDK 用 Kotlin 2.4 构建）一起定；升到 2.4 时一并评估 AGP。
agp = "8.10.1"
kotlin = "2.3.20"
# 运行 Gradle 和编译用的 JDK；根 build.gradle.kts 会检查
jdk = "21"
# 产出的字节码版本（Java 与 Kotlin 一致）。ACP SDK 本身是 Java 8 字节码，D8 / R8 都能处理 17
jvmTarget = "17"
compileSdk = "36"
targetSdk = "36"
minSdk = "35"

# ACP Kotlin SDK：固定 0.30.1，Gradle 解析到 JVM 变体 acp-jvm。
# 不用 master：master 的 Transport 已改成 TransportFrame / onFrame，与 0.30.x 的 JsonRpcMessage / onMessage 不兼容。
acp = "0.30.1"
# 由 1.9.0（acp-jvm-0.30.1.pom 的版本）升到 1.11.0（整合人决定，2026-09-29）：quickjs-kt 1.0.15 需要 ≥ 1.11.0，
# 1.9.0 / 1.10.2 下运行时 NoSuchMethodError（lane B 的 W3 验证）；不显式升级时，测试类路径被悄悄解析成 1.11.0、
# 主代码仍是 1.9.0，两边不一致。acp 0.30.1 在 1.11.0 上的行为由 tests/device/acp-channel 回归重跑验证。
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.7.3"

# 宿主层的网络出口（给 Pi 用的 fetch，core/runtime/net/HostFetch.kt）。
# S5 固定 Ktor 的 OkHttp 引擎时如需升级到 5.x，一并评估。
okhttp = "4.12.0"

# JS 引擎（S8 固定，docs/spikes/S8.md d）：quickjs-kt 1.0.15。它用 Kotlin 2.4.10 构建，要求 Kotlin ≥ 2.3；
# 运行时传递依赖把 kotlin-stdlib 拉到 2.4.10（编译器仍是 2.3.20，可以读 2.4 元数据；不强行压回 2.3.20）、
# kotlinx-coroutines-core 需要 1.11.0（已在上面统一锁定）。Kotlin 的最终版本随 S5 定。
# Gradle 按平台解析：JVM 模块得到 quickjs-kt-jvm（自带桌面原生库，只用于电脑上的测试），Android 得到 quickjs-kt-android。
quickjs-kt = "1.0.15"
junit4 = "4.13.2"

# SQLite 驱动（W2 选定，A lane）：androidx.sqlite 的 SQLiteDriver 接口，Android 与电脑测试共用同一套 schema 和 SQL。
# core/runtime 只依赖接口（sqlite）；电脑上的测试用 sqlite-bundled（BundledSQLiteDriver，jar 自带 macOS / Linux / Windows 原生库）；
# :app 的 AndroidStore 用 sqlite-bundled（与测试同一份 SQLite）或 sqlite-framework（系统 SQLite）。2.7.1 用 Kotlin 2.1.20 构建。
androidx-sqlite = "2.7.1"
# 设备测试（lane B，W6/B3：app 的 androidTest 在 :agent 进程里跑 PiAdapter 契约）
androidx-test-runner = "1.5.2"
androidx-test-ext-junit = "1.1.5"

# 示例 App（plugins/samples/*，W17）的界面：Jetpack Compose + Material 3。只给示例 App 用；:app（AgentOS 自带界面）仍然是平台 View。
# 版本由整合人在 2026-10-07 起示例 App 时锁定。不能用最新的 BOM 2026.09.00（Compose 1.12 / core 1.19 要求 AGP ≥ 9.1.0 和 compileSdk 37），
# 2026.01.00 + activity 1.12.2 + lifecycle 2.10.0 + core 1.17.0 在 AGP 8.10.1 / compileSdk 36 下 assembleDebug 通过。
# 示例 App 不要自己加别的界面库或升级这几项，需要的先提给整合人（升级要连 AGP 一起评估）。
compose-bom = "2026.01.00"
androidx-activity = "1.12.2"
androidx-lifecycle = "2.10.0"
androidx-core = "1.17.0"

[libraries]
acp = { module = "com.agentclientprotocol:acp", version.ref = "acp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# Android 主线程调度器；sdk:binder-channel 用（W5），版本与 acp 0.30.1 的 coroutines 对齐
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
quickjs-kt = { module = "io.github.dokar3:quickjs-kt", version.ref = "quickjs-kt" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Compose 编译器插件（只给示例 App 用），版本号与 Kotlin 一致
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
